spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:config/telemetry/{application}
            - classpath:config/infra/{application}

server:
  port: 8888

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
